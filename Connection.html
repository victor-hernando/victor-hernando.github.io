	<style>
		.regisrty_container
		{
			display: flex;
    		flex-wrap: nowrap;
		    flex-direction: column;

		    background-color: beige;

		}
	</style>
	<body>
		<script type="module">
			// Import the functions you need from the SDKs you need
    	    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    	  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";
    	    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-analytics.js";
    	    // TODO: Add SDKs for Firebase products that you want to use
    	    // https://firebase.google.com/docs/web/setup#available-libraries

    	    // Your web app's Firebase configuration
    	    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    	    const firebaseConfig = {
    	      apiKey: "AIzaSyAWAEJahdFnVkQQk7whGWbGru3lus_f4sE",
    	      authDomain: "test1-df122.firebaseapp.com",
    	      databaseURL: "https://test1-df122-default-rtdb.europe-west1.firebasedatabase.app",
    	      projectId: "test1-df122",
    	      storageBucket: "test1-df122.firebasestorage.app",
    	      messagingSenderId: "745442720279",
    	      appId: "1:745442720279:web:43eff7bb8a3a4abd357a52",
    	      measurementId: "G-ZJ8TSC1WJ4"
    	    };

    	    // Initialize Firebase
    	    const app = initializeApp(firebaseConfig);
    	    const analytics = getAnalytics(app);
    	  const db = getDatabase(app);

    	  const colorRef = ref(db, 'sharedColor');
    	  const txtRef = ref(db, 'sharedText');

    	  const box = document.getElementById('box');
    	  const btn = document.getElementById('btn');
    	  const NameTxtField = document.getElementById('NameText');
    	  const AgeTxtField = document.getElementById('AgeText');

    	  function spawnPrefab()
    	  {
    	      const l_template = document.getElementById("registryTemplate");
    	      const l_clone = l_template.content.cloneNode(true); // copia profunda
    	      const l_container = document.getElementById("textareaContainer");

    	      // Buscar botón eliminar dentro del clon
    	      const l_removeBtn = l_clone.querySelector(".removeBtn");
    	      l_removeBtn.onclick = function()
    	      {
    	          // El padre del botón es el elemento entero
    	          this.parentElement.remove();
    	      };

    	      // Añadir una línea de separación opcional
    	      const l_br = document.createElement("br");

    	      l_container.appendChild(l_br);
    	      l_container.appendChild(l_clone);
    	  }

    	  onValue(colorRef, (snapshot) => {
    	      const color = snapshot.val() || 'red';
    	      box.style.background = color;
    	  });

    	  onValue(txtRef, (snapshot) => {
    	      const text = snapshot.val();
    	      //txtRefField.value = text;

    	      console.log("Info changed");
    	      console.log("User's name; "+text.name);
    	      console.log("User's age; "+text.age);

    	      //NameTxtField.value=text.name;
    	      //AgeTxtField.value=text.age;
    	  });

    	  //addTextareaBtn.addEventListener('click', () => {spawnPrefab();});

    	  btn.addEventListener('click', () => {
    	      const newColor = box.style.background === 'red' ? 'blue' : 'red';
    	      set(colorRef, newColor);

    	      var userInfo={name: NameTxtField.value, age: AgeTxtField.value};
    	      console.log(userInfo);
    	      set(txtRef, userInfo);
    	  });
		</script>

    	<h1>Hola Mundo!</h1>
    	<p>Welcome to my 2nd GitHub Page!</p>

		<div id="box" style="width: 150px; height: 150px; background: blue; margin: 20px auto;"></div>
		<!--div id="container">
			<input type="text" id="NameText" name="name" required="" minlength="4" maxlength="8" size="10" style="width:150px;height:150px; auto">
			<textarea id="AgeText" name="age" style="width:550px;height:150px; auto"></textarea>
		</div-->
		<button id="addTextareaBtn">Añadir textarea</button>
		<button id="btn" onclick="spawnPrefab()">Cambiar color</button>
		<div id="textareaContainer"></div>

		<template id="registryTemplate">
			<div class="regisrty_container">
				<input id="name" rows="1" cols="40" placeholder = "Nombre..." style="position: relative"></input>
				<button class="addBtn">Añadir Entrada</button>
				<button class="removeBtn">Eliminar</button>
			</div>
		</template>
		<template id="textareaTemplate">
			<div class="textArea_container">
				<textarea id="textContent" placeholder = "Escribe algo..." style="position: relative; top: -15%; left: 15px; height: 50px; width: calc(100% - 30px);"></textarea>
				<button class="removeBtn">Eliminar</button>
			</div>
		</template>
 	</body>
