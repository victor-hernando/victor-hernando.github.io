		    function spawnPrefab(template, containerClose, useParent)
		    {
		        const l_template = document.getElementById(template);
		        const l_clone = l_template.content.cloneNode(true); // copia profunda
		        var l_container = containerClose
		        if(useParent)
		            l_container=containerClose.parentElement;

		        const l_root = l_clone.children[0];

		        console.log("Reference: "+containerClose+" container "+l_container);
				
		        l_container.appendChild(l_clone);

		        return l_root;
		    }
			function spawnEntry(parentRegistry, info, regKey, entryKey)
			{
				var l_entry=spawnPrefab('entryTemplate', parentRegistry, false);
				if(info!="")
					l_entry.children[0].value=info.texts[entryKey];
				
				let l_removeBtn = l_entry.querySelector(".removeBtn");
				
				let l_newIdx=entryKey;
				
				l_removeBtn.onclick = function()
				{
					// El padre del botón es el elemento entero
					l_removeBtn.parentElement.remove();
					console.log("index "+l_newIdx+" is "+m_Registers[regKey].texts[l_newIdx]);
					m_Registers[regKey].texts.splice(l_newIdx,1);
					//l_br.remove();
				};
				
				return l_entry;
			}

					{

					}
				}
			}

		<script>

				var l_registry=spawnPrefab('registryTemplate',l_parent, false);

					//l_br.remove();
				};

					var l_entryIdx=l_newRegister.texts.length
					var l_entry=spawnEntry(l_registry, "", l_Idx, l_entryIdx);
					l_entry.style.display="block";
