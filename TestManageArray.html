			var m_Info=new Array("1","2","3","4","5");
			
			function erease()
			{
				m_Info.splice(1,1);
			}
			function printt()
			{
				console.log("Logs:");
				for (const l_text in m_Info)
					console.log("\t"+m_Info[l_text]);
			}
		</script>
		<div id="textareaContainer" class="container">
			<button id="btn" onclick="printt()">printt</button>
